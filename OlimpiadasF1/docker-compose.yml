services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: olimpiadas-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "1434:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./data:/var/opt/mssql/import:ro

    restart: unless-stopped

volumes:
  sqlserver_data: